<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskTopia — Edit Task</title>
    <link rel="stylesheet" href="styles.css"/>
    <style>
        .btn-delete {
          width: 100%;
          padding: 14px;
          border-radius: 12px;
          border: none;
          background: rgba(255,107,107,0.10);
          color: var(--accent-red);
          font-family: 'Poppins', sans-serif;
          font-size: 0.95rem;
          font-weight: 600;
          cursor: pointer;
          margin-top: 12px;
          transition: background 0.15s;
        }
        .btn-delete:hover { background: rgba(255,107,107,0.22); }

        .task-detail-header {
          display: flex;
          align-items: center;
          gap: 14px;
          margin-bottom: 28px;
          padding-bottom: 20px;
          border-bottom: 1px solid var(--border);
        }
        .detail-priority-dot {
          width: 12px; height: 12px;
          border-radius: 50%;
          flex-shrink: 0;
        }
        .detail-meta-row {
          display: flex;
          gap: 10px;
          margin-bottom: 20px;
          flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- ══════════════ SIDEBAR ══════════════ -->
    <aside class="sidebar">
        <div class="sidebar-logo">Task<span>Topia</span></div>

        <div class="sidebar-section-label">Categories</div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="homepage.html"><span class="nav-icon">🏠</span> All Tasks</a>
            <a class="nav-item" href="category-work.html"><span class="nav-icon">💼</span> Work</a>
            <a class="nav-item" href="category-grocery.html"><span class="nav-icon">🛒</span> Grocery</a>
            <a class="nav-item" href="category-personal.html"><span class="nav-icon">👤</span> Personal</a>
            <a class="nav-item" href="category-school.html"><span class="nav-icon">📚</span> School</a>
            <a class="nav-item" href="category-medical.html"><span class="nav-icon">🏥</span> Medical</a>
            <a class="nav-item" href="category-social.html"><span class="nav-icon">🎉</span> Social</a>
            <a class="nav-item" href="category-fitness.html"><span class="nav-icon">🏋️</span> Fitness</a>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-new-cat" onclick="showToast('Feature coming soon!')">
            <span>＋</span> New Category
        </div>

        <div class="sidebar-bottom">
            <button class="btn-settings-side" onclick="window.location.href='help-and-settings.html'">
                ⚙️ Help &amp; Settings
            </button>
            <button class="btn-logout" onclick="window.location.href='login.html'">
                🚪 Log Out
            </button>
        </div>
    </aside>

    <!-- ══════════════ MAIN ══════════════ -->
    <main class="main">
        <div class="form-page-wrap">

            <a class="back-btn" href="homepage.html">← Back to Tasks</a>

            <div class="form-card" id="form-card">
                <div class="form-title">Edit Task</div>

                <div class="form-group">
                    <label class="form-label" for="task-name">Task Name</label>
                    <input class="form-input" id="task-name" type="text" placeholder="Task name"/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="task-desc">Description</label>
                    <textarea class="form-textarea" id="task-desc" placeholder="Task description..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="task-date">Date</label>
                        <input class="form-input" id="task-date" type="date"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="task-time">Time</label>
                        <input class="form-input" id="task-time" type="time"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="task-category">Category</label>
                        <select class="form-select" id="task-category">
                            <option value="work">Work</option>
                            <option value="grocery">Grocery</option>
                            <option value="personal">Personal</option>
                            <option value="school">School</option>
                            <option value="medical">Medical</option>
                            <option value="social">Social</option>
                            <option value="fitness">Fitness</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="task-priority">Priority</label>
                        <select class="form-select" id="task-priority">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>

                <button class="btn-submit" onclick="saveTask()">Submit</button>
                <button class="btn-delete" onclick="deleteTask()">🗑️ Delete Task</button>
            </div>

        </div>
    </main>

</div>

<div class="toast" id="toast"></div>

<script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function getTasks() {
      const raw = sessionStorage.getItem('tt_tasks');
      return raw ? JSON.parse(raw) : [];
    }
    function saveTasks(tasks) { sessionStorage.setItem('tt_tasks', JSON.stringify(tasks)); }

    /* Read ?id= from URL */
    const params  = new URLSearchParams(window.location.search);
    const taskId  = parseInt(params.get('id'));
    let   tasks   = getTasks();
    const task    = tasks.find(t => t.id === taskId);

    if (task) {
      document.getElementById('task-name').value     = task.name;
      document.getElementById('task-desc').value     = task.desc || '';
      document.getElementById('task-date').value     = task.date || '';
      document.getElementById('task-time').value     = task.time || '';
      document.getElementById('task-category').value = task.category || 'personal';
      document.getElementById('task-priority').value = task.priority || 'medium';
    } else {
      document.getElementById('form-card').innerHTML =
        '<p style="color:var(--text-muted);text-align:center;padding:40px 0">Task not found.</p>';
    }

    function saveTask() {
      if (!task) return;
      task.name     = document.getElementById('task-name').value.trim();
      task.desc     = document.getElementById('task-desc').value.trim();
      task.date     = document.getElementById('task-date').value;
      task.time     = document.getElementById('task-time').value;
      task.category = document.getElementById('task-category').value;
      task.priority = document.getElementById('task-priority').value;

      if (!task.name) { showToast('Task name cannot be empty'); return; }
      saveTasks(tasks);
      showToast('✅ Task updated!');
      setTimeout(() => window.location.href = 'homepage.html', 900);
    }

    function deleteTask() {
      if (!confirm('Delete this task?')) return;
      tasks = tasks.filter(t => t.id !== taskId);
      saveTasks(tasks);
      showToast('🗑️ Task deleted');
      setTimeout(() => window.location.href = 'homepage.html', 900);
    }
</script>
</body>
</html>
