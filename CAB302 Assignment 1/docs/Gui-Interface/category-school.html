<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskTopia — School Tasks</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="app-shell">

    <!-- ══════════════ SIDEBAR ══════════════ -->
    <aside class="sidebar">
        <div class="sidebar-logo">Task<span>Topia</span></div>

        <div class="sidebar-section-label">Categories</div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="homepage.html"><span class="nav-icon">🏠</span> All Tasks</a>
            <a class="nav-item" href="category-work.html"><span class="nav-icon">💼</span> Work</a>
            <a class="nav-item" href="category-grocery.html"><span class="nav-icon">🛒</span> Grocery</a>
            <a class="nav-item" href="category-personal.html"><span class="nav-icon">👤</span> Personal</a>
            <a class="nav-item active" href="category-school.html"><span class="nav-icon">📚</span> School</a>
            <a class="nav-item" href="category-medical.html"><span class="nav-icon">🏥</span> Medical</a>
            <a class="nav-item" href="category-social.html"><span class="nav-icon">🎉</span> Social</a>
            <a class="nav-item" href="category-fitness.html"><span class="nav-icon">🏋️</span> Fitness</a>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-new-cat" onclick="showToast('Feature coming soon!')">
            <span>＋</span> New Category
        </div>

        <div class="sidebar-bottom">
            <button class="btn-settings-side" onclick="window.location.href='help-and-settings.html'">
                ⚙️ Help &amp; Settings
            </button>
            <button class="btn-logout" onclick="window.location.href='login.html'">
                🚪 Log Out
            </button>
        </div>
    </aside>

    <!-- ══════════════ MAIN ══════════════ -->
    <main class="main">
        <div class="main-header">
            <div>
                <div class="main-title">📚 School Tasks</div>
                <div class="main-subtitle">Tasks in the School category</div>
            </div>
            <div class="header-date" id="header-date"></div>
        </div>

        <div class="tasks-list" id="tasks-list"></div>

        <div class="add-task-row">
            <button class="btn-add btn-add-ai" onclick="window.location.href='add-task-ai.html'">
                <span class="btn-icon">✨</span> Add Smart Task
            </button>
            <button class="btn-add btn-add-manual" onclick="window.location.href='add-task-manually.html'">
                <span class="btn-icon btn-icon-blue">＋</span> Add Task Manually
            </button>
        </div>
    </main>

</div>

<div class="toast" id="toast"></div>

<script>
    const CATEGORY = 'school';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function getTasks() {
      const raw = sessionStorage.getItem('tt_tasks');
      if (raw) return JSON.parse(raw);
      const seed = [
        { id: 1, name: 'Buy Milk',    desc: 'Full cream, 2L', time: '15:04', date: '2025-04-20', category: 'grocery', priority: 'medium', done: false },
        { id: 2, name: 'Team Meeting', desc: 'Weekly standup', time: '07:35', date: '2025-04-20', category: 'work',    priority: 'high',   done: false },
      ];
      sessionStorage.setItem('tt_tasks', JSON.stringify(seed));
      return seed;
    }
    function saveTasks(t) { sessionStorage.setItem('tt_tasks', JSON.stringify(t)); }

    function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d + 'T00:00:00').toLocaleDateString('en-AU', {
        weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
      });
    }

    function toggleDone(id) {
      const tasks = getTasks();
      const t = tasks.find(x => x.id === id);
      if (t) { t.done = !t.done; saveTasks(tasks); render(); showToast(t.done ? '✅ Task completed!' : 'Marked incomplete'); }
    }

    function render() {
      const tasks    = getTasks().filter(t => t.category === CATEGORY);
      const list     = document.getElementById('tasks-list');

      if (!tasks.length) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">📚</div><div class="empty-text">No School tasks yet — add one below!</div></div>`;
        return;
      }

      list.innerHTML = tasks.map(t => `
        <div class="task-card priority-${t.priority}" onclick="window.location.href='edit-task.html?id=${t.id}'">
          <div class="task-check ${t.done ? 'done' : ''}"
               onclick="event.stopPropagation(); toggleDone(${t.id})">
            ${t.done ? '✓' : ''}
          </div>
          <div class="task-info">
            <div class="task-name ${t.done ? 'done' : ''}">${t.name}</div>
            <div class="task-meta">
              <span class="badge badge-category">School</span>
              <span class="badge badge-${t.priority}">Priority: ${cap(t.priority)}</span>
              ${t.date ? `<span>📅 ${formatDate(t.date)}</span>` : ''}
            </div>
          </div>
          <div class="task-time">${t.time || ''}</div>
        </div>
      `).join('');
    }

    document.getElementById('header-date').textContent =
      new Date().toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    render();
</script>
</body>
</html>
