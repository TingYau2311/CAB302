<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskTopia — Add Task</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="app-shell">

    <!-- ══════════════ SIDEBAR ══════════════ -->
    <aside class="sidebar">
        <div class="sidebar-logo">Task<span>Topia</span></div>

        <div class="sidebar-section-label">Categories</div>
        <nav class="sidebar-nav">
            <a class="nav-item" href="homepage.html"><span class="nav-icon">🏠</span> All Tasks</a>
            <a class="nav-item" href="category-work.html"><span class="nav-icon">💼</span> Work</a>
            <a class="nav-item" href="category-grocery.html"><span class="nav-icon">🛒</span> Grocery</a>
            <a class="nav-item" href="category-personal.html"><span class="nav-icon">👤</span> Personal</a>
            <a class="nav-item" href="category-school.html"><span class="nav-icon">📚</span> School</a>
            <a class="nav-item" href="category-medical.html"><span class="nav-icon">🏥</span> Medical</a>
            <a class="nav-item" href="category-social.html"><span class="nav-icon">🎉</span> Social</a>
            <a class="nav-item" href="category-fitness.html"><span class="nav-icon">🏋️</span> Fitness</a>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-new-cat" onclick="showToast('Feature coming soon!')">
            <span>＋</span> New Category
        </div>

        <div class="sidebar-bottom">
            <button class="btn-settings-side" onclick="window.location.href='help-and-settings.html'">
                ⚙️ Help &amp; Settings
            </button>
            <button class="btn-logout" onclick="window.location.href='login.html'">
                🚪 Log Out
            </button>
        </div>
    </aside>

    <!-- ══════════════ MAIN ══════════════ -->
    <main class="main">
        <div class="form-page-wrap">

            <a class="back-btn" href="homepage.html">← Back to Tasks</a>

            <div class="form-card">
                <div class="form-title">Add Task</div>

                <div class="form-group">
                    <label class="form-label" for="task-name">Task Name</label>
                    <input class="form-input" id="task-name" type="text" placeholder="Task name"/>
                </div>

                <div class="form-group">
                    <label class="form-label" for="task-desc">Description</label>
                    <textarea class="form-textarea" id="task-desc" placeholder="Task description..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="task-date">Date</label>
                        <input class="form-input" id="task-date" type="date"/>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="task-time">Time</label>
                        <input class="form-input" id="task-time" type="time"/>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="task-category">Category</label>
                        <select class="form-select" id="task-category">
                            <option value="">Select Category</option>
                            <option value="work">Work</option>
                            <option value="grocery">Grocery</option>
                            <option value="personal">Personal</option>
                            <option value="school">School</option>
                            <option value="medical">Medical</option>
                            <option value="social">Social</option>
                            <option value="fitness">Fitness</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="task-priority">Priority</label>
                        <select class="form-select" id="task-priority">
                            <option value="">Select Priority</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>

                <button class="btn-submit" onclick="submitTask()">Submit</button>
            </div>

        </div>
    </main>

</div>

<div class="toast" id="toast"></div>

<script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function getTasks() {
      const raw = sessionStorage.getItem('tt_tasks');
      if (raw) return JSON.parse(raw);
      return [];
    }
    function saveTasks(tasks) { sessionStorage.setItem('tt_tasks', JSON.stringify(tasks)); }

    function submitTask() {
      const name     = document.getElementById('task-name').value.trim();
      const desc     = document.getElementById('task-desc').value.trim();
      const date     = document.getElementById('task-date').value;
      const time     = document.getElementById('task-time').value;
      const category = document.getElementById('task-category').value;
      const priority = document.getElementById('task-priority').value;

      if (!name) { showToast('Please enter a task name'); return; }
      if (!category) { showToast('Please select a category'); return; }
      if (!priority) { showToast('Please select a priority'); return; }

      const tasks = getTasks();
      const maxId = tasks.reduce((m, t) => Math.max(m, t.id), 0);
      tasks.push({ id: maxId + 1, name, desc, date, time, category, priority, done: false });
      saveTasks(tasks);

      showToast('✅ Task added!');
      setTimeout(() => window.location.href = 'homepage.html', 900);
    }
</script>
</body>
</html>
