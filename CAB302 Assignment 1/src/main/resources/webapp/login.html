<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>TaskTopia — Login</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="login-page">
    <div class="login-card">
        <div class="login-logo">Task<span>Topia</span></div>
        <div class="login-tagline">Your tasks, organised</div>

        <input
                id="username"
                class="login-input"
                type="text"
                placeholder="Username"
                autocomplete="username"
        />
        <input
                id="password"
                class="login-input"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
        />

        <button class="btn-login" onclick="doLogin()">Sign in</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      if (!u || !p) {
        showToast('Please enter your username and password');
        return;
      }
      /* Save username for other pages to read */
      sessionStorage.setItem('tt_user', u);
      window.location.href = 'homepage.html';
    }

    /* Allow pressing Enter to submit */
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
</script>
</body>
</html>
